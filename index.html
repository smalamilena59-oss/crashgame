<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON Crash - Kitty Adventure</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0a0b1a 0%, #1a1f3a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }
        
        .game-container {
            max-width: 1200px;
            width: 100%;
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            gap: 12px;
            background: rgba(10, 11, 26, 0.95);
            border-radius: 32px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        
        /* Left Panel - Players */
        .players-panel {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 24px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .panel-title {
            color: #8b8ca7;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
        }
        
        .players-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 500px;
            overflow-y: auto;
        }
        
        .player-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255, 215, 0, 0.1);
            transition: all 0.2s;
        }
        
        .player-item.current {
            background: rgba(255, 215, 0, 0.1);
            border-color: #ffd700;
        }
        
        .player-avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #ffd700, #ffb347);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #1a1b2f;
        }
        
        .player-info {
            flex: 1;
        }
        
        .player-name {
            color: white;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
        }
        
        .player-bet {
            color: #ffd700;
            font-size: 12px;
            font-weight: 600;
        }
        
        .player-cashout {
            color: #00c853;
            font-size: 12px;
            font-weight: 600;
        }
        
        /* Center Panel - Game Area */
        .game-panel {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 32px;
            padding: 24px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            position: relative;
            min-height: 500px;
            display: flex;
            flex-direction: column;
        }
        
        .round-info {
            display: flex;
            justify-content: space-between;
            color: #8b8ca7;
            font-size: 14px;
            margin-bottom: 20px;
        }
        
        .round-number {
            background: rgba(255, 215, 0, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        
        .timer {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
        }
        
        .timer.warning {
            color: #ffd700;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        /* Kitty Container */
        .kitty-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            margin: 20px 0;
            cursor: pointer;
        }
        
        .kitty {
            font-size: 120px;
            transition: all 0.1s ease;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.3));
            position: relative;
            z-index: 3;
        }
        
        .kitty.crashed {
            animation: fall 0.5s ease-in forwards;
        }
        
        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(200px) rotate(360deg);
                opacity: 0;
            }
        }
        
        .crash-text {
            font-size: 48px;
            font-weight: 900;
            color: #ff4d4d;
            text-shadow: 0 0 30px rgba(255, 77, 77, 0.5);
            margin-top: 20px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 2;
        }
        
        .crash-text.show {
            opacity: 1;
            animation: shake 0.5s ease-in-out;
        }
        
        .multiplier {
            font-size: 72px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            margin-top: 10px;
            z-index: 2;
        }
        
        .multiplier.crashed {
            color: #ff4d4d;
            text-shadow: 0 0 30px rgba(255, 77, 77, 0.5);
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        
        .explosion {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,77,77,0.8) 0%, rgba(255,77,77,0) 70%);
            border-radius: 50%;
            transform: scale(0);
            animation: explode 0.5s ease-out forwards;
            pointer-events: none;
            z-index: 1;
        }
        
        @keyframes explode {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            100% {
                transform: scale(3);
                opacity: 0;
            }
        }
        
        .game-status {
            text-align: center;
            font-size: 18px;
            color: #8b8ca7;
            margin: 20px 0;
        }
        
        .bet-controls {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 24px;
            padding: 20px;
        }
        
        .bet-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        
        .bet-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 16px;
            color: white;
            font-size: 18px;
        }
        
        .bet-input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .bet-presets {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }
        
        .preset-btn {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            padding: 10px;
            color: #ffd700;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .preset-btn:hover:not(:disabled) {
            background: rgba(255, 215, 0, 0.2);
        }
        
        .preset-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        .btn {
            padding: 18px;
            border: none;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: #ffd700;
            color: #1a1b2f;
        }
        
        .btn-primary:hover:not(:disabled) {
            background: #ffed4a;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4);
        }
        
        .btn-success {
            background: #00c853;
            color: white;
        }
        
        .btn-success:hover:not(:disabled) {
            background: #00e676;
            transform: translateY(-2px);
        }
        
        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        /* Right Panel - History & Stats */
        .history-panel {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 24px;
            padding: 16px;
        }
        
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 16px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .history-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #ffd700;
        }
        
        .history-item.crash {
            border-left-color: #ff4d4d;
        }
        
        .history-multiplier {
            font-size: 18px;
            font-weight: 700;
            color: #ffd700;
        }
        
        .history-item.crash .history-multiplier {
            color: #ff4d4d;
        }
        
        .history-players {
            color: #8b8ca7;
            font-size: 12px;
        }
        
        .history-time {
            color: #4a4b65;
            font-size: 10px;
        }
        
        /* Balance */
        .balance-card {
            background: rgba(255, 215, 0, 0.1);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #ffd700;
        }
        
        .balance-amount {
            font-size: 32px;
            font-weight: bold;
            color: white;
        }
        
        .ton-symbol {
            color: #ffd700;
            font-size: 20px;
        }
        
        /* Responsive */
        @media (max-width: 900px) {
            .game-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- Left Panel - Players -->
        <div class="players-panel">
            <div class="panel-title">🎮 Players in Game</div>
            <div class="balance-card">
                <div style="color: #8b8ca7; font-size: 12px; margin-bottom: 8px;">Your Balance</div>
                <div class="balance-amount">
                    <span id="balance">1000.00</span>
                    <span class="ton-symbol">TON</span>
                </div>
            </div>
            <div class="players-list" id="playersList">
                <!-- Players will be added here dynamically -->
            </div>
        </div>
        
        <!-- Center Panel - Game -->
        <div class="game-panel">
            <div class="round-info">
                <div class="round-number">Round #<span id="roundNumber">1</span></div>
                <div class="timer" id="timer">Next: 5s</div>
            </div>
            
            <div class="kitty-container" id="kittyContainer">
                <div class="kitty" id="kitty">🐱</div>
                <div class="crash-text" id="crashText">CRASH!</div>
                <div class="multiplier" id="multiplier">1.00x</div>
                <div class="explosion" id="explosion" style="display: none;"></div>
            </div>
            
            <div class="game-status" id="gameStatus">Next round in 5s...</div>
            
            <div class="bet-controls">
                <div class="bet-input-group">
                    <input type="number" id="betAmount" class="bet-input" value="1.0" min="0.1" step="0.1">
                </div>
                <div class="bet-presets">
                    <button class="preset-btn" onclick="setBet(0.5)" id="preset05">0.5 TON</button>
                    <button class="preset-btn" onclick="setBet(1.0)" id="preset1">1 TON</button>
                    <button class="preset-btn" onclick="setBet(2.0)" id="preset2">2 TON</button>
                    <button class="preset-btn" onclick="setBet(5.0)" id="preset5">5 TON</button>
                </div>
                <div class="action-buttons">
                    <button class="btn btn-primary" id="placeBetBtn" onclick="placeBet()">Place Bet</button>
                    <button class="btn btn-success" id="cashoutBtn" onclick="cashout()" disabled>Cash Out</button>
                </div>
            </div>
        </div>
        
        <!-- Right Panel - History -->
        <div class="history-panel">
            <div class="panel-title">📊 Round History</div>
            <div class="history-list" id="historyList">
                <!-- History items will be added here -->
            </div>
        </div>
    </div>

    <script>
        // Game state
        let currentUser = {
            id: 'user_' + Math.random().toString(36).substr(2, 9),
            name: 'Player_' + Math.floor(Math.random() * 1000),
            balance: 1000,
            currentBet: 0,
            hasBet: false,
            cashoutMultiplier: 0
        };
        
        let gameState = {
            roundNumber: 1,
            isActive: false,
            bettingOpen: false,
            currentMultiplier: 1.00,
            crashPoint: 1.00,
            timeUntilNext: 5,
            players: []
        };
        
        let gameInterval = null;
        let countdownInterval = null;
        
        // Bot players with realistic behavior
        let botPlayers = [
            { id: 'bot1', name: 'CryptoKing', bet: 0, cashout: 0, avatar: '👑', risk: 'high' },
            { id: 'bot2', name: 'MoonHunter', bet: 0, cashout: 0, avatar: '🌙', risk: 'medium' },
            { id: 'bot3', name: 'Whale', bet: 0, cashout: 0, avatar: '🐋', risk: 'low' },
            { id: 'bot4', name: 'LuckyOne', bet: 0, cashout: 0, avatar: '🍀', risk: 'medium' },
            { id: 'bot5', name: 'Satoshi', bet: 0, cashout: 0, avatar: '🥷', risk: 'high' },
            { id: 'bot6', name: 'DiamondHands', bet: 0, cashout: 0, avatar: '💎', risk: 'low' },
            { id: 'bot7', name: 'PaperHands', bet: 0, cashout: 0, avatar: '📄', risk: 'very_low' },
            { id: 'bot8', name: 'Rocket', bet: 0, cashout: 0, avatar: '🚀', risk: 'high' }
        ];
        
        // DOM elements
        const timerEl = document.getElementById('timer');
        const gameStatusEl = document.getElementById('gameStatus');
        const placeBetBtn = document.getElementById('placeBetBtn');
        const cashoutBtn = document.getElementById('cashoutBtn');
        const betAmountInput = document.getElementById('betAmount');
        const presetBtns = document.querySelectorAll('.preset-btn');
        const kittyEl = document.getElementById('kitty');
        const crashTextEl = document.getElementById('crashText');
        const multiplierEl = document.getElementById('multiplier');
        const explosionEl = document.getElementById('explosion');
        
        // Start the game
        function init() {
            startCountdown();
            updatePlayersList();
        }
        
        // Start countdown between rounds
        function startCountdown() {
            gameState.bettingOpen = false;
            gameState.isActive = false;
            gameState.timeUntilNext = 5;
            
            // Enable betting controls? No, betting opens at 3 seconds
            enableBettingControls(false);
            
            // Update UI
            timerEl.textContent = `Next: ${gameState.timeUntilNext}s`;
            timerEl.classList.add('warning');
            gameStatusEl.textContent = `Next round in ${gameState.timeUntilNext}s...`;
            
            // Reset kitty and multiplier
            kittyEl.classList.remove('crashed');
            kittyEl.style.opacity = '1';
            kittyEl.style.transform = 'none';
            crashTextEl.classList.remove('show');
            multiplierEl.classList.remove('crashed');
            multiplierEl.textContent = '1.00x';
            explosionEl.style.display = 'none';
            
            // Clear any existing intervals
            if (countdownInterval) clearInterval(countdownInterval);
            if (gameInterval) clearInterval(gameInterval);
            
            // Start countdown
            countdownInterval = setInterval(() => {
                gameState.timeUntilNext--;
                timerEl.textContent = `Next: ${gameState.timeUntilNext}s`;
                
                // Open betting at 3 seconds
                if (gameState.timeUntilNext === 3) {
                    gameState.bettingOpen = true;
                    enableBettingControls(true);
                    gameStatusEl.textContent = `Betting open! ${gameState.timeUntilNext}s left`;
                } else if (gameState.timeUntilNext <= 3 && gameState.timeUntilNext > 0) {
                    gameStatusEl.textContent = `Betting open! ${gameState.timeUntilNext}s left`;
                } else {
                    gameStatusEl.textContent = `Next round in ${gameState.timeUntilNext}s...`;
                }
                
                if (gameState.timeUntilNext <= 0) {
                    clearInterval(countdownInterval);
                    startGameRound();
                }
            }, 1000);
        }
        
        // Start actual game round
        function startGameRound() {
            gameState.bettingOpen = false;
            gameState.isActive = true;
            gameState.currentMultiplier = 1.00;
            gameState.roundNumber++;
            
            // Generate crash point - mostly between 1.2 and 4.0, sometimes 1.0x
            const rand = Math.random();
            if (rand < 0.1) { // 10% chance of instant crash at 1.0x
                gameState.crashPoint = 1.00;
            } else {
                // Biased towards lower multipliers
                gameState.crashPoint = 1.2 + (Math.random() * 2.8); // Between 1.2 and 4.0
                // Add occasional high multiplier (5% chance)
                if (Math.random() < 0.05) {
                    gameState.crashPoint = 4.0 + (Math.random() * 2.0); // Between 4.0 and 6.0
                }
            }
            
            // Disable betting controls
            enableBettingControls(false);
            
            // Update UI
            timerEl.textContent = 'Flying...';
            timerEl.classList.remove('warning');
            document.getElementById('roundNumber').textContent = gameState.roundNumber;
            
            // Bot betting logic - not all bots bet, and they bet at different times
            scheduleBotBets();
            
            // Start multiplier (slower - every 100ms instead of 50ms)
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(() => {
                if (gameState.isActive) {
                    gameState.currentMultiplier += 0.01;
                    multiplierEl.textContent = gameState.currentMultiplier.toFixed(2) + 'x';
                    
                    // Check for crash
                    if (gameState.currentMultiplier >= gameState.crashPoint) {
                        crash();
                    }
                }
            }, 100); // Slower updates (was 50ms)
        }
        
        // Schedule bot bets at different times
        function scheduleBotBets() {
            // Reset all bot bets
            botPlayers = botPlayers.map(bot => ({
                ...bot,
                bet: 0,
                cashout: 0
            }));
            
            // Randomly select 2-4 bots to bet this round
            const numBets = Math.floor(Math.random() * 3) + 2; // 2 to 4 bots
            const shuffled = [...botPlayers].sort(() => 0.5 - Math.random());
            const selectedBots = shuffled.slice(0, numBets);
            
            selectedBots.forEach((bot, index) => {
                // Schedule bet at different times during the first 2 seconds
                const betTime = (index + 1) * 400; // 400ms, 800ms, 1200ms, etc.
                
                setTimeout(() => {
                    if (gameState.isActive) {
                        // Find the bot in the array and update its bet
                        const botIndex = botPlayers.findIndex(b => b.id === bot.id);
                        if (botIndex !== -1) {
                            // Random bet amount between 0.5 and 5.0
                            const betAmount = parseFloat((Math.random() * 4.5 + 0.5).toFixed(2));
                            botPlayers[botIndex].bet = betAmount;
                            
                            // Schedule cashout based on risk profile
                            scheduleBotCashout(botPlayers[botIndex]);
                            
                            updatePlayersList();
                        }
                    }
                }, betTime);
            });
        }
        
        // Schedule bot cashout based on risk profile
        function scheduleBotCashout(bot) {
            if (!gameState.isActive) return;
            
            let cashoutMultiplier;
            
            // Different risk profiles
            switch(bot.risk) {
                case 'very_low':
                    // Cashes out very early (1.1x - 1.5x)
                    cashoutMultiplier = 1.1 + Math.random() * 0.4;
                    break;
                case 'low':
                    // Cashes out early (1.3x - 1.8x)
                    cashoutMultiplier = 1.3 + Math.random() * 0.5;
                    break;
                case 'medium':
                    // Medium risk (1.5x - 2.5x)
                    cashoutMultiplier = 1.5 + Math.random() * 1.0;
                    break;
                case 'high':
                    // High risk (2.0x - 3.5x)
                    cashoutMultiplier = 2.0 + Math.random() * 1.5;
                    break;
                default:
                    cashoutMultiplier = 1.5 + Math.random() * 1.0;
            }
            
            // Don't cashout if multiplier already past their target
            if (cashoutMultiplier >= gameState.crashPoint) {
                // They'll lose
                return;
            }
            
            // Calculate when to cashout (when multiplier reaches their target)
            const checkInterval = setInterval(() => {
                if (!gameState.isActive) {
                    clearInterval(checkInterval);
                    return;
                }
                
                if (gameState.currentMultiplier >= cashoutMultiplier) {
                    // Bot cashes out
                    const botIndex = botPlayers.findIndex(b => b.id === bot.id);
                    if (botIndex !== -1 && botPlayers[botIndex].bet > 0 && botPlayers[botIndex].cashout === 0) {
                        botPlayers[botIndex].cashout = gameState.currentMultiplier;
                        updatePlayersList();
                    }
                    clearInterval(checkInterval);
                }
            }, 100);
        }
        
        // Crash the game
        function crash() {
            gameState.isActive = false;
            clearInterval(gameInterval);
            
            // Show crash animation
            kittyEl.classList.add('crashed');
            crashTextEl.classList.add('show');
            multiplierEl.classList.add('crashed');
            explosionEl.style.display = 'block';
            
            // Count players in game
            const playersInGame = botPlayers.filter(p => p.bet > 0).length + (currentUser.hasBet ? 1 : 0);
            
            // Add to history
            addToHistory(gameState.crashPoint, playersInGame);
            
            gameStatusEl.textContent = `💥 CRASH at ${gameState.crashPoint.toFixed(2)}x!`;
            
            // Check if current user lost bet
            if (currentUser.hasBet && currentUser.cashoutMultiplier === 0) {
                // User lost their bet
                currentUser.hasBet = false;
                currentUser.currentBet = 0;
                gameStatusEl.textContent += ` You lost!`;
                updatePlayersList();
            }
            
            // Start next round after 3 seconds
            setTimeout(() => {
                startCountdown();
            }, 3000);
        }
        
        // Cash out
        function cashout() {
            if (!gameState.isActive) {
                alert('Game is not active!');
                return;
            }
            
            if (!currentUser.hasBet) {
                alert('No active bet!');
                return;
            }
            
            if (currentUser.cashoutMultiplier > 0) {
                alert('Already cashed out!');
                return;
            }
            
            // Calculate winnings
            const winnings = currentUser.currentBet * gameState.currentMultiplier;
            currentUser.balance += winnings;
            currentUser.cashoutMultiplier = gameState.currentMultiplier;
            currentUser.hasBet = false;
            
            // Update UI
            document.getElementById('balance').textContent = currentUser.balance.toFixed(2);
            cashoutBtn.disabled = true;
            
            // Show success message
            gameStatusEl.textContent = `✅ Cashed out at ${gameState.currentMultiplier.toFixed(2)}x! +${winnings.toFixed(2)} TON`;
            
            updatePlayersList();
        }
        
        // Place bet
        function placeBet() {
            if (!gameState.bettingOpen) {
                alert('Betting is closed! Wait for next round.');
                return;
            }
            
            if (currentUser.hasBet) {
                alert('You already have an active bet for this round!');
                return;
            }
            
            const betAmount = parseFloat(document.getElementById('betAmount').value);
            
            if (betAmount > currentUser.balance) {
                alert('Insufficient balance!');
                return;
            }
            
            if (betAmount < 0.1) {
                alert('Minimum bet is 0.1 TON');
                return;
            }
            
            // Place bet
            currentUser.balance -= betAmount;
            currentUser.currentBet = betAmount;
            currentUser.hasBet = true;
            currentUser.cashoutMultiplier = 0;
            
            // Update UI
            document.getElementById('balance').textContent = currentUser.balance.toFixed(2);
            placeBetBtn.disabled = true;
            
            updatePlayersList();
            
            // Show confirmation
            gameStatusEl.textContent = `Bet placed: ${betAmount} TON`;
        }
        
        // Set bet amount from presets
        function setBet(amount) {
            if (gameState.bettingOpen) {
                document.getElementById('betAmount').value = amount;
            }
        }
        
        // Enable/disable betting controls
        function enableBettingControls(enabled) {
            betAmountInput.disabled = !enabled;
            presetBtns.forEach(btn => {
                btn.disabled = !enabled;
            });
            
            // Place bet button is enabled only during betting phase AND if user hasn't bet yet
            placeBetBtn.disabled = !enabled || currentUser.hasBet;
            
            // Cashout button is enabled only during active game AND if user has bet and hasn't cashed out
            cashoutBtn.disabled = !gameState.isActive || !currentUser.hasBet || currentUser.cashoutMultiplier > 0;
        }
        
        // Update players list
        function updatePlayersList() {
            const playersList = document.getElementById('playersList');
            playersList.innerHTML = '';
            
            // Add current user if they have a bet
            if (currentUser.hasBet) {
                const userItem = createPlayerElement({
                    id: currentUser.id,
                    name: currentUser.name + ' (You)',
                    bet: currentUser.currentBet,
                    cashout: currentUser.cashoutMultiplier,
                    isCurrent: true,
                    avatar: '👤'
                });
                playersList.appendChild(userItem);
            }
            
            // Add bot players with bets
            botPlayers.forEach(player => {
                if (player.bet > 0 || player.cashout > 0) {
                    const playerItem = createPlayerElement(player);
                    playersList.appendChild(playerItem);
                }
            });
            
            // If no players, show message
            if (playersList.children.length === 0) {
                const emptyMsg = document.createElement('div');
                emptyMsg.style.color = '#4a4b65';
                emptyMsg.style.textAlign = 'center';
                emptyMsg.style.padding = '20px';
                emptyMsg.textContent = 'No bets this round';
                playersList.appendChild(emptyMsg);
            }
        }
        
        function createPlayerElement(player) {
            const div = document.createElement('div');
            div.className = `player-item ${player.isCurrent ? 'current' : ''}`;
            
            const avatar = player.avatar || '👤';
            const betText = player.bet > 0 ? `${player.bet} TON` : '';
            const cashoutText = player.cashout > 0 ? `💰 ${player.cashout}x` : '';
            
            div.innerHTML = `
                <div class="player-avatar">${avatar}</div>
                <div class="player-info">
                    <div class="player-name">${player.name}</div>
                    ${betText ? `<div class="player-bet">⬆️ ${betText}</div>` : ''}
                    ${cashoutText ? `<div class="player-cashout">✅ ${cashoutText}</div>` : ''}
                </div>
            `;
            
            return div;
        }
        
        // Add to history
        function addToHistory(multiplier, playersCount) {
            const historyList = document.getElementById('historyList');
            const item = document.createElement('div');
            item.className = `history-item ${multiplier < 1.5 ? 'crash' : ''}`;
            
            const now = new Date();
            const timeStr = `${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')}`;
            
            item.innerHTML = `
                <div>
                    <div class="history-multiplier">${multiplier.toFixed(2)}x</div>
                    <div class="history-players">${playersCount} players</div>
                </div>
                <div class="history-time">${timeStr}</div>
            `;
            
            historyList.insertBefore(item, historyList.firstChild);
            
            // Keep only last 15 items
            while (historyList.children.length > 15) {
                historyList.removeChild(historyList.lastChild);
            }
        }
        
        // Initialize the game
        init();
    </script>
</body>
</html>
