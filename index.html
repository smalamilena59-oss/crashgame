<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON Crash Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a1b2f 0%, #2a2f4f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        
        .game-container {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* Telegram WebApp header space */
        .tg-header {
            height: 20px;
            margin-bottom: 16px;
            color: #8b8ca7;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
        }
        
        /* Balance card */
        .balance-card {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }
        
        .balance-label {
            color: #8b8ca7;
            font-size: 14px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .ton-icon {
            width: 20px;
            height: 20px;
            background: #0088cc;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: white;
        }
        
        .balance-amount {
            font-size: 36px;
            font-weight: bold;
            color: white;
            display: flex;
            align-items: baseline;
            gap: 8px;
        }
        
        .ton-symbol {
            color: #ffd700;
            font-size: 24px;
        }
        
        /* Multiplier display */
        .multiplier-container {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 30px;
            padding: 40px 20px;
            margin-bottom: 20px;
            text-align: center;
            border: 2px solid #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
            position: relative;
            overflow: hidden;
        }
        
        .multiplier {
            font-size: 72px;
            font-weight: 800;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            transition: all 0.1s ease;
        }
        
        .multiplier.crashed {
            color: #ff4d4d;
            text-shadow: 0 0 20px rgba(255, 77, 77, 0.5);
        }
        
        .game-status {
            margin-top: 10px;
            font-size: 18px;
            color: #8b8ca7;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        /* Game controls */
        .bet-section {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .bet-input-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        
        .bet-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 16px;
            color: white;
            font-size: 18px;
            font-weight: 500;
        }
        
        .bet-input:focus {
            outline: none;
            border-color: #ffd700;
        }
        
        .bet-presets {
            display: flex;
            gap: 8px;
        }
        
        .preset-btn {
            flex: 1;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            padding: 10px;
            color: #ffd700;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .preset-btn:hover {
            background: rgba(255, 215, 0, 0.2);
        }
        
        /* Action buttons */
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }
        
        .btn {
            flex: 1;
            padding: 18px;
            border: none;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-primary {
            background: #ffd700;
            color: #1a1b2f;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }
        
        .btn-primary:hover:not(:disabled) {
            background: #ffed4a;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4);
        }
        
        .btn-success {
            background: #00c853;
            color: white;
            box-shadow: 0 4px 15px rgba(0, 200, 83, 0.3);
        }
        
        .btn-success:hover:not(:disabled) {
            background: #00e676;
            transform: translateY(-2px);
        }
        
        /* TON Connect button */
        .ton-connect {
            background: #0088cc;
            border: none;
            border-radius: 16px;
            padding: 12px 24px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .ton-connect:hover {
            background: #00a3e0;
        }
        
        /* History */
        .history {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
        }
        
        .history-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: 600;
            color: #ffd700;
        }
        
        .history-item.crash {
            color: #ff4d4d;
        }
        
        /* Responsive */
        @media (max-width: 480px) {
            .multiplier {
                font-size: 48px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- Telegram WebApp header -->
        <div class="tg-header">
            <span>TON Crash Game</span>
            <span id="user-name">Anonymous</span>
        </div>
        
        <!-- Balance Card -->
        <div class="balance-card">
            <div class="balance-label">
                <span class="ton-icon">Ⓣ</span>
                Your Balance
            </div>
            <div class="balance-amount">
                <span id="balance">100.00</span>
                <span class="ton-symbol">TON</span>
            </div>
        </div>
        
        <!-- TON Connect Button -->
        <button class="ton-connect" id="connectWallet" onclick="connectWallet()">
            <span>🔌</span>
            Connect TON Wallet
        </button>
        
        <!-- Multiplier Display -->
        <div class="multiplier-container">
            <div class="multiplier" id="multiplier">1.00x</div>
            <div class="game-status" id="gameStatus">Waiting for next round</div>
        </div>
        
        <!-- Betting Section -->
        <div class="bet-section">
            <div class="bet-input-group">
                <input type="number" id="betAmount" class="bet-input" value="1.0" min="0.1" step="0.1" placeholder="Bet amount">
            </div>
            
            <div class="bet-presets">
                <button class="preset-btn" onclick="setBet(0.5)">0.5 TON</button>
                <button class="preset-btn" onclick="setBet(1.0)">1 TON</button>
                <button class="preset-btn" onclick="setBet(2.0)">2 TON</button>
                <button class="preset-btn" onclick="setBet(5.0)">5 TON</button>
            </div>
        </div>
        
        <!-- Action Buttons -->
        <div class="action-buttons">
            <button class="btn btn-primary" id="placeBetBtn" onclick="placeBet()">Place Bet</button>
            <button class="btn btn-success" id="cashoutBtn" onclick="cashout()" disabled>Cash Out</button>
        </div>
        
        <!-- History -->
        <div class="history" id="history">
            <div class="history-item">2.34x</div>
            <div class="history-item crash">1.12x</div>
            <div class="history-item">3.45x</div>
            <div class="history-item">1.67x</div>
        </div>
    </div>
    
    <script>
        // Game state
        let balance = 100.0;
        let currentMultiplier = 1.0;
        let gameActive = false;
        let hasBet = false;
        let currentBet = 0;
        let gameInterval = null;
        let crashPoint = 1.0;
        let walletConnected = false;
        
        // DOM elements
        const balanceEl = document.getElementById('balance');
        const multiplierEl = document.getElementById('multiplier');
        const gameStatusEl = document.getElementById('gameStatus');
        const placeBetBtn = document.getElementById('placeBetBtn');
        const cashoutBtn = document.getElementById('cashoutBtn');
        const betAmountInput = document.getElementById('betAmount');
        const connectWalletBtn = document.getElementById('connectWallet');
        const userNameEl = document.getElementById('user-name');
        
        // Telegram WebApp integration
        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            tg.expand(); // Expand to full height
            tg.ready(); // Notify Telegram that app is ready
            
            // Get user info
            const user = tg.initDataUnsafe?.user;
            if (user) {
                userNameEl.textContent = user.first_name || 'Player';
            }
            
            // Set theme colors
            document.body.style.background = tg.themeParams.bg_color || document.body.style.background;
        }
        
        // TON Connect simulation (in real app, use @tonconnect/sdk)
        function connectWallet() {
            // This is a simulation - in real app, implement TON Connect
            walletConnected = !walletConnected;
            
            if (walletConnected) {
                connectWalletBtn.innerHTML = '<span>✅</span> Wallet Connected (Demo)';
                connectWalletBtn.style.background = '#00c853';
                // Add demo balance
                balance = 1000;
                updateBalance();
            } else {
                connectWalletBtn.innerHTML = '<span>🔌</span> Connect TON Wallet';
                connectWalletBtn.style.background = '#0088cc';
            }
        }
        
        // Update balance display
        function updateBalance() {
            balanceEl.textContent = balance.toFixed(2);
        }
        
        // Set bet amount from presets
        function setBet(amount) {
            betAmountInput.value = amount;
        }
        
        // Place bet
        function placeBet() {
            if (!walletConnected) {
                alert('Please connect TON wallet first!');
                return;
            }
            
            const betAmount = parseFloat(betAmountInput.value);
            
            if (betAmount > balance) {
                alert('Insufficient balance!');
                return;
            }
            
            if (gameActive) {
                alert('Wait for next round!');
                return;
            }
            
            if (hasBet) {
                alert('You already have an active bet!');
                return;
            }
            
            // Deduct bet from balance
            currentBet = betAmount;
            balance -= betAmount;
            updateBalance();
            
            hasBet = true;
            placeBetBtn.disabled = true;
            
            // Start game immediately for demo
            startGame();
        }
        
        // Start new game round
        function startGame() {
            gameActive = true;
            currentMultiplier = 1.0;
            
            // Generate random crash point (between 1.0 and 10.0 for demo)
            crashPoint = 1.0 + Math.random() * 9.0;
            
            // Update UI
            multiplierEl.classList.remove('crashed');
            gameStatusEl.textContent = 'Game in progress...';
            cashoutBtn.disabled = !hasBet;
            
            // Start multiplier increase
            if (gameInterval) clearInterval(gameInterval);
            
            gameInterval = setInterval(() => {
                // Increase multiplier
                currentMultiplier += 0.01;
                multiplierEl.textContent = currentMultiplier.toFixed(2) + 'x';
                
                // Check for crash
                if (currentMultiplier >= crashPoint) {
                    crash();
                }
            }, 50); // Update every 50ms for smooth animation
            
            // Auto-crash timer (just for safety)
            setTimeout(() => {
                if (gameActive) {
                    crash();
                }
            }, 30000); // Max 30 seconds per round
        }
        
        // Cash out
        function cashout() {
            if (!gameActive || !hasBet) {
                alert('No active bet to cash out!');
                return;
            }
            
            // Calculate winnings
            const winnings = currentBet * currentMultiplier;
            balance += winnings;
            updateBalance();
            
            // Add to history
            addToHistory(currentMultiplier, false);
            
            // Show success
            gameStatusEl.textContent = `Cashed out at ${currentMultiplier.toFixed(2)}x! +${winnings.toFixed(2)} TON`;
            
            // Reset for next round
            resetRound();
        }
        
        // Crash the game
        function crash() {
            if (!gameActive) return;
            
            gameActive = false;
            clearInterval(gameInterval);
            
            multiplierEl.classList.add('crashed');
            
            // Add crash to history
            addToHistory(crashPoint, true);
            
            if (hasBet) {
                gameStatusEl.textContent = `CRASHED at ${crashPoint.toFixed(2)}x! You lost ${currentBet.toFixed(2)} TON`;
                hasBet = false;
            } else {
                gameStatusEl.textContent = `Crashed at ${crashPoint.toFixed(2)}x`;
            }
            
            // Schedule next round
            setTimeout(() => {
                multiplierEl.textContent = '1.00x';
                multiplierEl.classList.remove('crashed');
                gameStatusEl.textContent = 'Place your bet!';
                placeBetBtn.disabled = false;
                cashoutBtn.disabled = true;
            }, 3000);
        }
        
        // Reset round after cashout
        function resetRound() {
            gameActive = false;
            hasBet = false;
            clearInterval(gameInterval);
            
            placeBetBtn.disabled = false;
            cashoutBtn.disabled = true;
            
            // Schedule next round
            setTimeout(() => {
                multiplierEl.textContent = '1.00x';
                gameStatusEl.textContent = 'Place your bet!';
            }, 2000);
        }
        
        // Add result to history
        function addToHistory(multiplier, isCrash) {
            const historyEl = document.getElementById('history');
            const item = document.createElement('div');
            item.className = `history-item ${isCrash ? 'crash' : ''}`;
            item.textContent = multiplier.toFixed(2) + 'x';
            
            historyEl.insertBefore(item, historyEl.firstChild);
            
            // Keep only last 8 items
            while (historyEl.children.length > 8) {
                historyEl.removeChild(historyEl.lastChild);
            }
        }
        
        // Initialize
        updateBalance();
        
        // Demo: auto-start rounds when no bets
        setInterval(() => {
            if (!gameActive && !hasBet) {
                // Demo round without bets
                crashPoint = 1.0 + Math.random() * 5.0;
                gameActive = true;
                currentMultiplier = 1.0;
                
                gameStatusEl.textContent = 'Demo round...';
                
                if (gameInterval) clearInterval(gameInterval);
                
                gameInterval = setInterval(() => {
                    currentMultiplier += 0.01;
                    multiplierEl.textContent = currentMultiplier.toFixed(2) + 'x';
                    
                    if (currentMultiplier >= crashPoint) {
                        crash();
                    }
                }, 50);
            }
        }, 8000);
    </script>
</body>
</html>
