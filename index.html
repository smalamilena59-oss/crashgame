<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TON Crash</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1f2f 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
        }

        /* Main container */
        .app-container {
            width: 100%;
            max-width: 1200px;
            height: 95vh;
            background: rgba(20, 22, 36, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 8px;
            border: 1px solid rgba(255, 215, 0, 0.15);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
        }

        /* Navigation Bar */
        .nav-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 8px 16px;
            background: rgba(12, 14, 24, 0.7);
            border-radius: 40px;
            margin-bottom: 8px;
            border: 1px solid rgba(255, 215, 0, 0.1);
        }

        .nav-btn {
            background: transparent;
            border: none;
            padding: 10px 24px;
            border-radius: 30px;
            color: #8b8ca7;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-btn i {
            font-size: 18px;
        }

        .nav-btn:hover {
            background: rgba(255, 215, 0, 0.1);
            color: #ffd700;
        }

        .nav-btn.active {
            background: #ffd700;
            color: #0f0f1a;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }

        /* Content Area */
        .content-area {
            flex: 1;
            position: relative;
            overflow: hidden;
            border-radius: 24px;
        }

        /* Panels */
        .panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(12, 14, 24, 0.7);
            backdrop-filter: blur(5px);
            border-radius: 24px;
            padding: 16px;
            border: 1px solid rgba(255, 215, 0, 0.1);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, opacity 0.3s ease;
            overflow-y: auto;
        }

        .panel.hidden {
            transform: translateX(100%);
            opacity: 0;
            pointer-events: none;
        }

        .panel.visible {
            transform: translateX(0);
            opacity: 1;
            pointer-events: all;
        }

        .panel-header {
            color: #8b8ca7;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .panel-header i {
            color: #ffd700;
            font-size: 16px;
        }

        /* ========== LEADERBOARD PANEL ========== */
        .leaderboard-stats {
            background: rgba(255, 215, 0, 0.05);
            border-radius: 16px;
            padding: 12px;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.15);
            margin-bottom: 16px;
        }

        .total-bets-label {
            color: #8b8ca7;
            font-size: 11px;
            margin-bottom: 4px;
        }

        .total-bets-value {
            color: #ffd700;
            font-size: 22px;
            font-weight: 700;
        }

        .leaderboard-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .leaderboard-item {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255, 215, 0, 0.08);
        }

        .leaderboard-rank {
            width: 24px;
            height: 24px;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffd700;
            font-weight: 700;
            font-size: 12px;
        }

        .leaderboard-avatar {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #ffd700, #ffb347);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            color: #0f0f1a;
        }

        .leaderboard-info {
            flex: 1;
        }

        .leaderboard-name {
            color: white;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .leaderboard-amount {
            color: #ffd700;
            font-size: 12px;
            font-weight: 600;
        }

        /* ========== CRASH PANEL ========== */
        .round-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px 12px;
            border-radius: 16px;
        }

        .round-number {
            color: #ffd700;
            font-size: 14px;
            font-weight: 600;
            background: rgba(255, 215, 0, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
        }

        .timer {
            color: #8b8ca7;
            font-size: 14px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 12px;
            border-radius: 20px;
        }

        .timer.warning {
            color: #ffd700;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .game-area {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 28px;
            padding: 16px;
            margin: 8px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 2px solid rgba(255, 215, 0, 0.2);
            min-height: 250px;
        }

        .kitty-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .kitty {
            font-size: 80px;
            transition: all 0.1s ease;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.4));
            margin-bottom: 10px;
        }

        .kitty.crashed {
            animation: fall 0.5s ease-in forwards;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(150px) rotate(360deg); opacity: 0; }
        }

        .multiplier {
            font-size: 48px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            line-height: 1;
        }

        .multiplier.crashed {
            color: #ff4d4d;
            text-shadow: 0 0 30px rgba(255, 77, 77, 0.5);
        }

        .crash-text {
            font-size: 30px;
            font-weight: 900;
            color: #ff4d4d;
            opacity: 0;
            transition: opacity 0.3s;
            position: absolute;
            bottom: 20px;
        }

        .crash-text.show {
            opacity: 1;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        .history-bar {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 12px;
            margin: 8px 0;
        }

        .history-title {
            color: #8b8ca7;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .history-stripes {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .history-stripe {
            width: 30px;
            height: 30px;
            background: rgba(255, 215, 0, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: #ffd700;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .history-stripe.crash {
            background: rgba(255, 77, 77, 0.2);
            color: #ff4d4d;
            border-color: rgba(255, 77, 77, 0.3);
        }

        .players-bar {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 10px;
            margin: 8px 0;
        }

        .players-title {
            color: #8b8ca7;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .players-grid {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
            min-height: 60px;
        }

        .players-grid::-webkit-scrollbar {
            height: 3px;
        }

        .players-grid::-webkit-scrollbar-thumb {
            background: rgba(255, 215, 0, 0.3);
            border-radius: 10px;
        }

        .player-chip {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 30px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255, 215, 0, 0.15);
            flex-shrink: 0;
        }

        .player-chip.current {
            background: rgba(255, 215, 0, 0.1);
            border-color: #ffd700;
        }

        .chip-avatar {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #ffd700, #ffb347);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            color: #0f0f1a;
        }

        .chip-name {
            color: white;
            font-size: 11px;
            font-weight: 600;
            max-width: 70px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chip-bet {
            color: #ffd700;
            font-size: 9px;
            font-weight: 600;
        }

        .bet-controls {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 12px;
            margin-top: 8px;
        }

        .bet-input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .bet-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 16px;
            padding: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
        }

        .bet-presets {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 8px;
        }

        .preset-btn {
            background: rgba(255, 215, 0, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 12px;
            padding: 8px;
            color: #ffd700;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn {
            padding: 14px;
            border: none;
            border-radius: 18px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #ffd700;
            color: #0f0f1a;
        }

        .btn-success {
            background: #00c853;
            color: white;
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* ========== PROFILE PANEL ========== */
        .profile-card {
            background: rgba(255, 215, 0, 0.05);
            border-radius: 24px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.2);
            margin-bottom: 16px;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #ffd700, #ffb347);
            border-radius: 50%;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: 600;
            color: #0f0f1a;
            border: 3px solid #ffd700;
        }

        .profile-name {
            color: white;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .profile-username {
            color: #8b8ca7;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .profile-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-item {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 12px;
        }

        .stat-label {
            color: #8b8ca7;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .stat-value {
            color: #ffd700;
            font-size: 20px;
            font-weight: 700;
        }

        .balance-big {
            background: rgba(255, 215, 0, 0.1);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            border: 1px solid #ffd700;
            margin-top: auto;
        }

        .balance-label {
            color: #8b8ca7;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .balance-amount {
            color: white;
            font-size: 36px;
            font-weight: 700;
        }

        .balance-amount span {
            color: #ffd700;
            font-size: 20px;
            margin-left: 5px;
        }

        .loading {
            text-align: center;
            color: #ffd700;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="app-container" id="gameContainer" style="display: none;">
        <!-- Navigation Bar -->
        <div class="nav-bar">
            <button class="nav-btn active" onclick="switchPanel('leaderboard')" id="nav-leaderboard">
                <i>🏆</i> Leaderboard
            </button>
            <button class="nav-btn" onclick="switchPanel('crash')" id="nav-crash">
                <i>🐱</i> Crash
            </button>
            <button class="nav-btn" onclick="switchPanel('profile')" id="nav-profile">
                <i>👤</i> Profile
            </button>
        </div>

        <!-- Content Area with Panels -->
        <div class="content-area">
            <!-- LEADERBOARD PANEL -->
            <div class="panel visible" id="panel-leaderboard">
                <div class="panel-header">
                    <i>🏆</i> LEADERBOARD
                </div>
                
                <div class="leaderboard-stats">
                    <div class="total-bets-label">Total Bets</div>
                    <div class="total-bets-value" id="totalBets">0 TON</div>
                </div>
                
                <div class="leaderboard-list" id="leaderboardList">
                    <!-- Leaderboard items will be added here -->
                </div>
            </div>
            
            <!-- CRASH PANEL -->
            <div class="panel hidden" id="panel-crash">
                <div class="round-header">
                    <div class="round-number">Round #<span id="roundNumber">1</span></div>
                    <div class="timer" id="timer">Next: 5s</div>
                </div>
                
                <div class="game-area">
                    <div class="kitty-wrapper">
                        <div class="kitty" id="kitty">🐱</div>
                        <div class="multiplier" id="multiplier">1.00x</div>
                        <div class="crash-text" id="crashText">CRASH!</div>
                    </div>
                </div>
                
                <div class="history-bar">
                    <div class="history-title">📊 ROUND HISTORY</div>
                    <div class="history-stripes" id="historyStripes">
                        <!-- History stripes will be added here -->
                    </div>
                </div>
                
                <div class="players-bar">
                    <div class="players-title">🎮 ACTIVE PLAYERS</div>
                    <div class="players-grid" id="playersGrid">
                        <!-- Player chips will be added here -->
                    </div>
                </div>
                
                <div class="bet-controls">
                    <div class="bet-input-row">
                        <input type="number" id="betAmount" class="bet-input" value="1.0" min="0.1" step="0.1" placeholder="Amount">
                    </div>
                    <div class="bet-presets">
                        <button class="preset-btn" onclick="setBet(0.5)">0.5</button>
                        <button class="preset-btn" onclick="setBet(1.0)">1.0</button>
                        <button class="preset-btn" onclick="setBet(2.0)">2.0</button>
                        <button class="preset-btn" onclick="setBet(5.0)">5.0</button>
                    </div>
                    <div class="action-buttons">
                        <button class="btn btn-primary" id="placeBetBtn" onclick="placeBet()">PLACE BET</button>
                        <button class="btn btn-success" id="cashoutBtn" onclick="cashout()" disabled>CASH OUT</button>
                    </div>
                </div>
            </div>
            
            <!-- PROFILE PANEL -->
            <div class="panel hidden" id="panel-profile">
                <div class="panel-header">
                    <i>👤</i> PROFILE
                </div>
                
                <div class="profile-card">
                    <div class="profile-avatar" id="profileAvatar">👤</div>
                    <div class="profile-name" id="profileName">Loading...</div>
                    <div class="profile-username" id="profileUsername">@username</div>
                    
                    <div class="profile-stats">
                        <div class="stat-item">
                            <div class="stat-label">Total Bets</div>
                            <div class="stat-value" id="userTotalBets">0</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">Win Rate</div>
                            <div class="stat-value" id="userWinRate">0%</div>
                        </div>
                    </div>
                </div>
                
                <div class="balance-big">
                    <div class="balance-label">Your Balance</div>
                    <div class="balance-amount">
                        <span id="balance">1000.00</span><span>TON</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="loading" id="loading">
        <div style="font-size: 48px; margin-bottom: 20px;">🐱</div>
        <div>Loading Telegram profile...</div>
    </div>

    <script>
        // Telegram WebApp integration
        let tg = window.Telegram?.WebApp;
        
        // Game state
        let currentUser = {
            id: null,
            name: 'Unknown',
            username: null,
            avatar: '👤',
            balance: 1000,
            currentBet: 0,
            hasBet: false,
            cashoutMultiplier: 0,
            totalBets: 0,
            wins: 0
        };
        
        let gameState = {
            roundNumber: 1,
            isActive: false,
            bettingOpen: false,
            currentMultiplier: 1.00,
            crashPoint: 1.00,
            timeUntilNext: 5,
            players: []
        };
        
        let gameInterval = null;
        let countdownInterval = null;
        
        // Leaderboard data
        let leaderboard = [
            { id: 'bot1', name: 'CryptoKing', totalBet: 12500, avatar: '👑' },
            { id: 'bot2', name: 'MoonHunter', totalBet: 8900, avatar: '🌙' },
            { id: 'bot3', name: 'Whale', totalBet: 7500, avatar: '🐋' },
            { id: 'bot4', name: 'LuckyOne', totalBet: 6200, avatar: '🍀' },
            { id: 'bot5', name: 'Satoshi', totalBet: 5100, avatar: '🥷' }
        ];
        
        // Bot players
        let botPlayers = [
            { id: 'bot1', name: 'CryptoKing', bet: 0, cashout: 0, avatar: '👑', risk: 'high' },
            { id: 'bot2', name: 'MoonHunter', bet: 0, cashout: 0, avatar: '🌙', risk: 'medium' },
            { id: 'bot3', name: 'Whale', bet: 0, cashout: 0, avatar: '🐋', risk: 'low' },
            { id: 'bot4', name: 'LuckyOne', bet: 0, cashout: 0, avatar: '🍀', risk: 'medium' },
            { id: 'bot5', name: 'Satoshi', bet: 0, cashout: 0, avatar: '🥷', risk: 'high' }
        ];
        
        // DOM elements
        const timerEl = document.getElementById('timer');
        const placeBetBtn = document.getElementById('placeBetBtn');
        const cashoutBtn = document.getElementById('cashoutBtn');
        const betAmountInput = document.getElementById('betAmount');
        const presetBtns = document.querySelectorAll('.preset-btn');
        const kittyEl = document.getElementById('kitty');
        const crashTextEl = document.getElementById('crashText');
        const multiplierEl = document.getElementById('multiplier');
        const gameContainer = document.getElementById('gameContainer');
        const loadingEl = document.getElementById('loading');
        
        // Navigation
        const panels = {
            leaderboard: document.getElementById('panel-leaderboard'),
            crash: document.getElementById('panel-crash'),
            profile: document.getElementById('panel-profile')
        };
        
        const navBtns = {
            leaderboard: document.getElementById('nav-leaderboard'),
            crash: document.getElementById('nav-crash'),
            profile: document.getElementById('nav-profile')
        };
        
        // Switch panel function
        function switchPanel(panelName) {
            // Hide all panels
            Object.values(panels).forEach(panel => {
                panel.classList.remove('visible');
                panel.classList.add('hidden');
            });
            
            // Show selected panel
            panels[panelName].classList.remove('hidden');
            panels[panelName].classList.add('visible');
            
            // Update nav buttons
            Object.values(navBtns).forEach(btn => {
                btn.classList.remove('active');
            });
            navBtns[panelName].classList.add('active');
        }
        
        // Initialize Telegram
        function initTelegram() {
            if (tg) {
                tg.expand();
                tg.ready();
                
                const user = tg.initDataUnsafe?.user;
                
                if (user) {
                    currentUser.id = user.id;
                    currentUser.name = user.first_name || 'Player';
                    if (user.last_name) {
                        currentUser.name += ' ' + user.last_name;
                    }
                    currentUser.username = user.username;
                    currentUser.avatar = currentUser.name.charAt(0).toUpperCase();
                    
                    // Update profile UI
                    document.getElementById('profileName').textContent = currentUser.name;
                    document.getElementById('profileUsername').textContent = user.username ? '@' + user.username : 'ID: ' + user.id;
                    document.getElementById('profileAvatar').textContent = currentUser.avatar;
                    
                    loadingEl.style.display = 'none';
                    gameContainer.style.display = 'flex';
                    
                    init();
                } else {
                    // Demo mode
                    currentUser.name = 'Demo Player';
                    currentUser.avatar = '👤';
                    document.getElementById('profileName').textContent = 'Demo Player';
                    document.getElementById('profileUsername').textContent = '@demo_user';
                    document.getElementById('profileAvatar').textContent = '👤';
                    
                    loadingEl.style.display = 'none';
                    gameContainer.style.display = 'flex';
                    
                    init();
                }
            } else {
                // Demo mode
                currentUser.name = 'Demo Player';
                currentUser.avatar = '👤';
                document.getElementById('profileName').textContent = 'Demo Player';
                document.getElementById('profileUsername').textContent = '@demo_user';
                document.getElementById('profileAvatar').textContent = '👤';
                
                loadingEl.style.display = 'none';
                gameContainer.style.display = 'flex';
                
                init();
            }
        }
        
        // Start the game
        function init() {
            updateLeaderboard();
            startCountdown();
            updatePlayersGrid();
        }
        
        // Update balance
        function updateBalance() {
            document.getElementById('balance').textContent = currentUser.balance.toFixed(2);
        }
        
        // Update leaderboard
        function updateLeaderboard() {
            const leaderboardList = document.getElementById('leaderboardList');
            leaderboardList.innerHTML = '';
            
            const allEntries = [
                ...leaderboard,
                { id: currentUser.id, name: currentUser.name + ' (You)', totalBet: currentUser.totalBets, avatar: currentUser.avatar }
            ].sort((a, b) => b.totalBet - a.totalBet).slice(0, 10);
            
            const totalBets = allEntries.reduce((sum, entry) => sum + entry.totalBet, 0);
            document.getElementById('totalBets').textContent = totalBets.toFixed(2) + ' TON';
            
            allEntries.forEach((entry, index) => {
                const item = document.createElement('div');
                item.className = 'leaderboard-item';
                item.innerHTML = `
                    <div class="leaderboard-rank">#${index + 1}</div>
                    <div class="leaderboard-avatar">${entry.avatar}</div>
                    <div class="leaderboard-info">
                        <div class="leaderboard-name">${entry.name}</div>
                        <div class="leaderboard-amount">${entry.totalBet.toFixed(2)} TON</div>
                    </div>
                `;
                leaderboardList.appendChild(item);
            });
        }
        
        // Update players grid
        function updatePlayersGrid() {
            const playersGrid = document.getElementById('playersGrid');
            playersGrid.innerHTML = '';
            
            if (currentUser.hasBet) {
                playersGrid.appendChild(createPlayerChip({
                    name: currentUser.name + ' (You)',
                    bet: currentUser.currentBet,
                    cashout: currentUser.cashoutMultiplier,
                    avatar: currentUser.avatar,
                    isCurrent: true
                }));
            }
            
            botPlayers.forEach(player => {
                if (player.bet > 0 || player.cashout > 0) {
                    playersGrid.appendChild(createPlayerChip(player));
                }
            });
            
            if (playersGrid.children.length === 0) {
                const emptyMsg = document.createElement('div');
                emptyMsg.style.color = '#4a4b65';
                emptyMsg.style.padding = '10px';
                emptyMsg.textContent = 'No active players';
                playersGrid.appendChild(emptyMsg);
            }
        }
        
        function createPlayerChip(player) {
            const div = document.createElement('div');
            div.className = `player-chip ${player.isCurrent ? 'current' : ''}`;
            
            div.innerHTML = `
                <div class="chip-avatar">${player.avatar}</div>
                <div class="chip-info">
                    <div class="chip-name">${player.name}</div>
                    ${player.bet ? `<div class="chip-bet">⬆️ ${player.bet} TON</div>` : ''}
                    ${player.cashout ? `<div class="chip-bet">✅ ${player.cashout}x</div>` : ''}
                </div>
            `;
            
            return div;
        }
        
        // Add to history stripes
        function addToHistory(multiplier) {
            const historyStripes = document.getElementById('historyStripes');
            const stripe = document.createElement('div');
            stripe.className = `history-stripe ${multiplier < 1.5 ? 'crash' : ''}`;
            stripe.textContent = multiplier.toFixed(2);
            
            historyStripes.insertBefore(stripe, historyStripes.firstChild);
            
            while (historyStripes.children.length > 15) {
                historyStripes.removeChild(historyStripes.lastChild);
            }
        }
        
        // Start countdown
        function startCountdown() {
            gameState.bettingOpen = false;
            gameState.isActive = false;
            gameState.timeUntilNext = 5;
            
            enableBettingControls(false);
            
            timerEl.textContent = `Next: ${gameState.timeUntilNext}s`;
            timerEl.classList.add('warning');
            
            kittyEl.classList.remove('crashed');
            crashTextEl.classList.remove('show');
            multiplierEl.classList.remove('crashed');
            multiplierEl.textContent = '1.00x';
            
            if (countdownInterval) clearInterval(countdownInterval);
            if (gameInterval) clearInterval(gameInterval);
            
            countdownInterval = setInterval(() => {
                gameState.timeUntilNext--;
                timerEl.textContent = `Next: ${gameState.timeUntilNext}s`;
                
                if (gameState.timeUntilNext === 3) {
                    gameState.bettingOpen = true;
                    enableBettingControls(true);
                }
                
                if (gameState.timeUntilNext <= 0) {
                    clearInterval(countdownInterval);
                    startGameRound();
                }
            }, 1000);
        }
        
        // Start game round
        function startGameRound() {
            gameState.bettingOpen = false;
            gameState.isActive = true;
            gameState.currentMultiplier = 1.00;
            gameState.roundNumber++;
            
            const rand = Math.random();
            if (rand < 0.1) {
                gameState.crashPoint = 1.00;
            } else {
                gameState.crashPoint = 1.2 + (Math.random() * 2.8);
                if (Math.random() < 0.05) {
                    gameState.crashPoint = 4.0 + (Math.random() * 2.0);
                }
            }
            
            enableBettingControls(false);
            
            timerEl.textContent = 'Flying...';
            timerEl.classList.remove('warning');
            document.getElementById('roundNumber').textContent = gameState.roundNumber;
            
            scheduleBotBets();
            
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(() => {
                if (gameState.isActive) {
                    gameState.currentMultiplier += 0.01;
                    multiplierEl.textContent = gameState.currentMultiplier.toFixed(2) + 'x';
                    
                    if (gameState.currentMultiplier >= gameState.crashPoint) {
                        crash();
                    }
                }
            }, 100);
        }
        
        // Schedule bot bets
        function scheduleBotBets() {
            botPlayers = botPlayers.map(bot => ({ ...bot, bet: 0, cashout: 0 }));
            
            const numBets = Math.floor(Math.random() * 3) + 2;
            const shuffled = [...botPlayers].sort(() => 0.5 - Math.random());
            const selectedBots = shuffled.slice(0, numBets);
            
            selectedBots.forEach((bot, index) => {
                const betTime = (index + 1) * 400;
                
                setTimeout(() => {
                    if (gameState.isActive) {
                        const botIndex = botPlayers.findIndex(b => b.id === bot.id);
                        if (botIndex !== -1) {
                            const betAmount = parseFloat((Math.random() * 4.5 + 0.5).toFixed(2));
                            botPlayers[botIndex].bet = betAmount;
                            
                            const leaderboardIndex = leaderboard.findIndex(l => l.id === bot.id);
                            if (leaderboardIndex !== -1) {
                                leaderboard[leaderboardIndex].totalBet += betAmount;
                            }
                            
                            scheduleBotCashout(botPlayers[botIndex]);
                            updatePlayersGrid();
                            updateLeaderboard();
                        }
                    }
                }, betTime);
            });
        }
        
        // Schedule bot cashout
        function scheduleBotCashout(bot) {
            if (!gameState.isActive) return;
            
            let cashoutMultiplier;
            
            switch(bot.risk) {
                case 'very_low': cashoutMultiplier = 1.1 + Math.random() * 0.4; break;
                case 'low': cashoutMultiplier = 1.3 + Math.random() * 0.5; break;
                case 'medium': cashoutMultiplier = 1.5 + Math.random() * 1.0; break;
                case 'high': cashoutMultiplier = 2.0 + Math.random() * 1.5; break;
                default: cashoutMultiplier = 1.5 + Math.random() * 1.0;
            }
            
            if (cashoutMultiplier >= gameState.crashPoint) return;
            
            const checkInterval = setInterval(() => {
                if (!gameState.isActive) {
                    clearInterval(checkInterval);
                    return;
                }
                
                if (gameState.currentMultiplier >= cashoutMultiplier) {
                    const botIndex = botPlayers.findIndex(b => b.id === bot.id);
                    if (botIndex !== -1 && botPlayers[botIndex].bet > 0 && botPlayers[botIndex].cashout === 0) {
                        botPlayers[botIndex].cashout = gameState.currentMultiplier;
                        updatePlayersGrid();
                    }
                    clearInterval(checkInterval);
                }
            }, 100);
        }
        
        // Crash
        function crash() {
            gameState.isActive = false;
            clearInterval(gameInterval);
            
            kittyEl.classList.add('crashed');
            crashTextEl.classList.add('show');
            multiplierEl.classList.add('crashed');
            
            addToHistory(gameState.crashPoint);
            
            if (currentUser.hasBet && currentUser.cashoutMultiplier === 0) {
                currentUser.hasBet = false;
                currentUser.currentBet = 0;
            }
            
            setTimeout(() => {
                startCountdown();
            }, 3000);
        }
        
        // Cash out
        function cashout() {
            if (!gameState.isActive || !currentUser.hasBet || currentUser.cashoutMultiplier > 0) return;
            
            const winnings = currentUser.currentBet * gameState.currentMultiplier;
            currentUser.balance += winnings;
            currentUser.cashoutMultiplier = gameState.currentMultiplier;
            currentUser.hasBet = false;
            currentUser.wins++;
            
            updateBalance();
            cashoutBtn.disabled = true;
            updatePlayersGrid();
            updateProfileStats();
        }
        
        // Place bet
        function placeBet() {
            if (!gameState.bettingOpen || currentUser.hasBet) return;
            
            const betAmount = parseFloat(document.getElementById('betAmount').value);
            
            if (betAmount > currentUser.balance || betAmount < 0.1) return;
            
            currentUser.balance -= betAmount;
            currentUser.currentBet = betAmount;
            currentUser.hasBet = true;
            currentUser.cashoutMultiplier = 0;
            currentUser.totalBets += betAmount;
            
            updateBalance();
            placeBetBtn.disabled = true;
            updatePlayersGrid();
            updateLeaderboard();
            updateProfileStats();
        }
        
        // Update profile stats
        function updateProfileStats() {
            document.getElementById('userTotalBets').textContent = currentUser.totalBets.toFixed(2);
            const winRate = currentUser.totalBets > 0 ? ((currentUser.wins / currentUser.totalBets) * 100).toFixed(1) : 0;
            document.getElementById('userWinRate').textContent = winRate + '%';
        }
        
        // Set bet amount
        function setBet(amount) {
            if (gameState.bettingOpen) {
                document.getElementById('betAmount').value = amount;
            }
        }
        
        // Enable/disable betting controls
        function enableBettingControls(enabled) {
            betAmountInput.disabled = !enabled;
            presetBtns.forEach(btn => btn.disabled = !enabled);
            placeBetBtn.disabled = !enabled || currentUser.hasBet;
            cashoutBtn.disabled = !gameState.isActive || !currentUser.hasBet || currentUser.cashoutMultiplier > 0;
        }
        
        // Initialize
        initTelegram();
    </script>
</body>
</html>
